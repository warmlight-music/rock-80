<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes of the Silver Stage</title>
<style>
  :root{
    --bg:#0c0a09; 
    --bg2:#1c1614; 
    --card:#251d1a;
    --accent:#c0c0c0; 
    --accent2:#8a8a8a;
    --text:#e8e0d5;
    --muted:#9e8f82;
    --glow:rgba(192,192,192,.15);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2) 0%, var(--bg) 70%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .lang { 
    align-self: flex-end; 
    display:flex; 
    gap:6px; 
    background:var(--card); 
    padding:4px; 
    border-radius:8px; 
    border:1px solid rgba(192,192,192,.2); 
  }
  .lang button { background:transparent; border:none; color:var(--muted); padding:6px 16px; border-radius:4px; font-weight:800; font-size:13px; cursor:pointer; transition:all .3s ease; }
  .lang button.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0c0a09; box-shadow:0 4px 14px var(--glow); }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; }
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:4px; object-fit:cover; box-shadow:0 20px 50px rgba(0,0,0,0.8); border:1px solid rgba(192,192,192,.2); pointer-events: none; filter: contrast(1.1) sepia(0.2); }
  .album__title { font-size:clamp(24px,5vw,40px); font-weight:900; letter-spacing:-.02em; color: #fff; text-transform: uppercase; line-height: 1.1; }
  .album__sub { color:var(--accent); font-size:14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }
  
  .track { flex:0 0 auto; width:200px; scroll-snap-align:center; background:var(--card); border-radius:4px; padding:10px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:1px solid rgba(255,255,255,.05); text-align:left; display: flex; flex-direction: column;}
  .track:hover { transform:translateY(-5px); box-shadow: 0 10px 25px var(--glow); border-color: rgba(192,192,192,.3); }
  .track.active { border:2px solid var(--accent); box-shadow:0 0 15px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:2px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0; filter: grayscale(0.3) contrast(1.1);}
  
  .track__num { font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.1em; margin-bottom:6px; }
  .track__name { font-size:15px; font-weight:800; margin-bottom:4px; line-height: 1.2; color: #fff; }
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.4; flex-grow: 1; font-style: italic; }

  .player { width:100%; max-width:600px; background:var(--card); border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.8); border:1px solid rgba(192,192,192,.15); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:4px; object-fit:cover; background:var(--bg2); border:1px solid var(--accent); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:800; font-size:16px; line-height:1.25; margin-bottom:2px; color: #fff;}
  .player__artist { color:var(--muted); font-size:13px; }
  .player audio { width:100%; outline: none; filter: sepia(0.2);}
  
  .player__nav { display:flex; justify-content:center; gap:16px; }
  .player__nav button { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#0c0a09; padding:12px 24px; border-radius:4px; font-weight:900; font-size:14px; cursor:pointer; transition:filter 0.3s; text-transform: uppercase; letter-spacing: 1px;}
  .player__nav button:hover { filter:brightness(1.2); }
</style>
</head>
<body>

  <div class="lang" role="group" aria-label="Language">
    <button id="btnRu">RU</button>
    <button id="btnEn" class="active">EN</button>
  </div>

  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Album Cover">
    <h1 class="album__title" id="albumTitle">Echoes of the Silver Stage</h1>
    <p class="album__sub" id="albumSub">Эхо серебряной сцены</p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Pick a track</div>
        <div class="player__artist" id="playerArtist">Silver Stage</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Prev</button>
      <button id="nextBtn">Next ⏭</button>
    </div>
  </div>

<script>
  const album = {
    titleEn: "Echoes of the Silver Stage",
    titleRu: "Эхо серебряной сцены",
    cover: "cover.jpg",
    tracks: [
      { id: 1, en: "Riding on the Thunder", ru: "Мы летим сквозь грозы" },
      { id: 2, en: "Rolling Down the Midnight Road", ru: "Рок-н-ролл на полную катушку" },
      { id: 3, en: "Across the Garden Fence", ru: "В окнах напротив" },
      { id: 4, en: "We’re Falling In", ru: "Мы влюблены" },
      { id: 5, en: "Mirage on the Desert Highway", ru: "Огни ночного шоссе" },
      { id: 6, en: "Wings of the Autumn Wind", ru: "Я всё ещё жду тебя" },
      { id: 7, en: "Crown of the Silver Stage", ru: "Занавес не опустится" },
      { id: 8, en: "Weeping Guitar Story", ru: "Плачущая гитара" }
    ]
  };

  let lang = 'en';
  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist= document.getElementById('playerArtist');
  const albumTitle  = document.getElementById('albumTitle');
  const albumSub    = document.getElementById('albumSub');
  const btnRu       = document.getElementById('btnRu');
  const btnEn       = document.getElementById('btnEn');

  const pad = (n) => String(n).padStart(2,'0');
  
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `${lang}${pad(id)}.mp3`;
  
  const trackName = (t) => lang === 'ru' ? t.ru : t.en;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${trackName(t)}">
        <div class="track__num">TRACK #${t.id}</div>
        <div class="track__name">${trackName(t)}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function updateAlbumHeader() {
    albumTitle.textContent = lang === 'ru' ? album.titleRu : album.titleEn;
    albumSub.textContent = lang === 'ru' ? album.titleEn : album.titleRu;
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = trackName(t);
    playerArtist.textContent = "Silver Stage";

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  function setLang(newLang){
    if (lang === newLang) return;
    
    const wasPlaying = !audio.paused;
    const time = audio.currentTime;

    lang = newLang;

    btnRu.classList.toggle('active', lang === 'ru');
    btnEn.classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;

    updateAlbumHeader(); 
    renderCarousel();
    
    document.getElementById('prevBtn').textContent = lang === 'en' ? '⏮ Prev' : '⏮ Пред';
    document.getElementById('nextBtn').textContent = lang === 'en' ? 'Next ⏭' : 'След ⏭';

    // Берем ИМЕННО ТОТ трек, который играл, и обновляем ему язык
    if (currentTrack >= 0){
      const t = album.tracks[currentTrack];
      
      // Обновляем картинку и текст строго по текущему индексу (currentTrack)
      playerCover.src = coverPath(t.id);
      playerTitle.textContent = trackName(t);
      
      // Обновляем музыку (подставляем новый язык)
      audio.src = songPath(t.id);
      audio.currentTime = time; 
      
      if (wasPlaying) {
        audio.play().catch(()=>{}); 
      }
    } else {
      playerTitle.textContent = lang === 'en' ? 'Pick a track' : 'Выбери трек';
    }
  }

  btnRu.addEventListener('click', () => setLang('ru'));
  btnEn.addEventListener('click', () => setLang('en'));

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  updateAlbumHeader();
  renderCarousel();
</script>
</body>
</html>
